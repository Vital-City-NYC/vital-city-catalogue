name: tweet-suggester
# Drafts posts for each new piece and feeds the Press page's "Who should hear
# about this" module (data/tweet_suggestions.json, a rolling 30 days).
#
# Plugged back in 2026-09-23 without an API key: with ANTHROPIC_API_KEY unset
# it writes free rule-based drafts built from this account's own measured
# posts (the dek, "Read [writer]: ...", a quoted sentence). Add the secret to
# switch to Claude drafts, about $0.02 a piece. Slack delivery happens only if
# SLACK_WEBHOOK_URL, or SLACK_BOT_TOKEN plus SLACK_DM_TO, is set; otherwise the
# drafts live on the Press page. A run commits only when a new piece appears.
on:
  schedule:
    - cron: "0 13-23 * * 1-5"   # hourly on weekdays, 9am to 7pm Eastern (summer)
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        default: "7"
      dry_run:
        description: "List new pieces without drafting (spends nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tweet-suggester
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the style screen still works
        run: python3 tweet_suggester.py --self-test

      - name: Scan and draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_TO: ${{ secrets.SLACK_DM_TO }}
        run: |
          python3 tweet_suggester.py \
            --days "${{ github.event.inputs.days || 7 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--slack' }}

      - name: Remember what has been suggested
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- data/tweet_suggester_seen.json data/tweet_suggestions.json; then
            echo "nothing new this run"
            exit 0
          fi
          git config user.name  "vital-city-bot"
          git config user.email "actions@github.com"
          git add data/tweet_suggester_seen.json data/tweet_suggestions.json
          git commit -m "Suggested posts for new pieces [skip ci]"
          # network-refresh commits to the same branch twice a day; rebase rather
          # than fail a run whose Slack message has already gone out.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
