name: press-contact-refresh

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the full refresh, which also publishes press/data.enc.
concurrency:
  group: network-refresh
  cancel-in-progress: false

jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet cryptography feedparser beautifulsoup4
      - name: Check contact enrichment
        run: python3 -m unittest discover -s tests -p 'test_press_contacts.py'
      - name: Enrich the current live press data and encrypt in GitHub
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          python3 refresh_press_contacts.py
          python3 encrypt_press.py
      - name: Publish only the encrypted press data
        run: |
          git config user.name "Vital City Bot"
          git config user.email "actions@users.noreply.github.com"
          git add press/data.enc
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified press contact addresses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
