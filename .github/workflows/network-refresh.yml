name: network-refresh

# Daily cloud refresh of the Contact Master Search.
# Runs on GitHub's servers, so it works whether or not Josh's laptop is on.
# Pulls current Ghost members + re-scrapes the article catalogue (live), rebuilds
# the fused people dataset from the encrypted source bundle, re-encrypts, and pushes
# (which auto-deploys GitHub Pages). Ghost only — no Mailchimp.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7am ET (EDT) / 6am ET (EST)
    - cron: "0 23 * * *"   # 23:00 UTC = 7pm ET (EDT) / 6pm ET (EST)
  workflow_dispatch:        # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: network-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet cryptography openpyxl feedparser beautifulsoup4   # feedparser + bs4: the press-map harvest

      - name: Restore secrets + decrypt source bundle
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          mkdir -p private
          printf '%s' "$GHOST_ADMIN_KEY" > private/.ghost_admin_key
          python3 bundle_sources.py unpack

      - name: Pull shared edits from the Google Sheet store
        env:
          OVERRIDES_URL: ${{ secrets.OVERRIDES_URL }}
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          if [ -n "$OVERRIDES_URL" ]; then
            curl -fsSL --get "$OVERRIDES_URL" --data-urlencode "pass=$VC_NETWORK_PASS" \
              -o private/people_overrides.json \
              && echo "fetched shared edits ($(wc -c < private/people_overrides.json) bytes)" \
              || echo "WARNING: could not fetch shared edits; continuing without"
          else
            echo "OVERRIDES_URL not set yet — skipping shared-edit pull"
          fi

      - name: Pull Mailchimp unsubscribes (live)
        env:
          MAILCHIMP_KEY: ${{ secrets.MAILCHIMP_KEY }}
        run: |
          if [ -n "$MAILCHIMP_KEY" ]; then
            python3 mailchimp_unsubs.py || echo "WARNING: Mailchimp unsubscribe pull failed; using bundled unsubscribed_source.csv"
            python3 mailchimp_engagement.py || echo "WARNING: Mailchimp engagement pull failed; continuing without"
          else
            echo "MAILCHIMP_KEY not set — using bundled unsubscribed_source.csv"
          fi

      - name: Pull Donorbox donors (live)
        env:
          DONORBOX_KEY: ${{ secrets.DONORBOX_KEY }}
          DONORBOX_EMAIL: info@vitalcitynyc.org
        run: |
          if [ -n "$DONORBOX_KEY" ]; then
            python3 donorbox_donors.py || echo "WARNING: Donorbox pull failed; using bundled donors_source.csv"
          else
            echo "DONORBOX_KEY not set — using bundled donors_source.csv"
          fi

      - name: Pull current Ghost members (live)
        run: python3 ghost_members.py --apply

      - name: Refresh article catalogue (live)
        run: python3 scrape.py

      # The senior-contributor roster from the site. Exits non-zero if the page
      # comes back without it, which keeps the last good data/senior_contributors.json.
      - name: Pull the senior-contributor roster (live)
        run: |
          python3 senior_contributors.py || echo "WARNING - senior-contributor pull failed; keeping the last roster"

      # Recompute the catalogue-analysis aggregates (data/catalogue_analysis.json)
      # that the /catalogue-analysis charts read. Pure recomputation from the
      # freshly scraped catalogue.json + authors.json; non-fatal.
      - name: Analyze catalogue for the breakdown charts
        run: |
          python3 analyze_catalogue.py || echo "WARNING: analyze_catalogue failed; analysis page will be stale"
          # analyze_subjects.py exits non-zero if a NEW topic tag appears that is
          # not yet sorted into subject / rubric / format. That is the intended
          # alarm — the beat charts go stale rather than silently dropping a tag.
          # Fix: add the tag to the right bucket in analyze_subjects.py.
          python3 analyze_subjects.py || echo "WARNING: analyze_subjects failed (likely an unsorted new topic tag); beat charts will be stale"

      - name: Flag influential people (Wikipedia, incremental)
        run: |
          python3 build_network.py >/dev/null 2>&1 || true   # need people.json for the candidate list
          python3 wiki_influence.py || echo "WARNING: Wikipedia influence check failed; using cached flags"

      - name: Rebuild fused people dataset
        run: python3 build_network.py

      # Runs BEFORE encryption so the engagement flags it writes into the
      # plaintext people.json get baked into the single passphrase-correct
      # encryption below. growth_pull.py NEVER encrypts — it only enriches
      # people.json and writes private/growth.json. (Decoupling encryption
      # from this step is what fixed the lockout where the inline re-encrypt
      # fell through to a generated passphrase.) Non-fatal: a failure here
      # leaves the dashboard stale but never blocks the contact-tool publish.
      - name: Build growth-dashboard data (Mailchimp + Ghost + Donorbox + X + IG + press)
        env:
          MAILCHIMP_KEY: ${{ secrets.MAILCHIMP_KEY }}
          DONORBOX_KEY:  ${{ secrets.DONORBOX_KEY }}
          DONORBOX_EMAIL: info@vitalcitynyc.org
          # Optional: unlocks Ghost's built-in site analytics (visitors/page
          # views) — integration keys are forbidden from /stats/*, staff
          # tokens are allowed. Absent → the website tiles stay stubbed.
          GHOST_STAFF_KEY: ${{ secrets.GHOST_STAFF_KEY }}
          # Optional: Google Analytics 4 website traffic (covers pre-April-2026
          # history). Both must be set for the visitor tiles to populate from GA4.
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDS_JSON:  ${{ secrets.GA4_CREDS_JSON }}
        run: |
          python3 growth_pull.py || echo "WARNING: growth_pull failed; growth dashboard will be stale"

      - name: Safety check — refuse to publish a gutted dataset
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: python3 sanity_check.py   # no fallback: a non-zero exit must stop the job before encrypt/commit

      - name: Encrypt for publishing
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: python3 encrypt_people.py

      - name: Encrypt growth-dashboard data for publishing
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          if [ -s private/growth.json ]; then
            python3 encrypt_growth.py
          else
            echo "no private/growth.json to encrypt — skipping"
          fi

      # The catalogue-analysis page is gated like the other dashboards: it reads
      # an encrypted bundle, not the plaintext data/*.json. Both steps must run
      # after the growth pull, because the reach section joins per-article
      # traffic and signups to the catalogue's subject tags.
      - name: Build and encrypt the catalogue-analysis bundle
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          if [ -s private/growth.json ]; then
            python3 build_catalogue_reach.py || echo "WARNING: reach build failed; page will hide the reach section"
          else
            echo "no growth.json — skipping reach build"
          fi
          python3 encrypt_catalogue_analysis.py

      - name: Build fundraising-prospects intelligence
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          if [ -s private/people.json ] && [ -s private/growth.json ]; then
            python3 build_prospects.py
          else
            echo "source data missing — skipping prospects build"
          fi

      # The resharing calendar joins the fresh catalogue to the New York City
      # calendar's dated events and ranks by lifetime views, so it runs after
      # the catalogue refresh and the growth pull. Non-fatal: a failure leaves
      # the page stale. Traffic falls back to the stored GA4 block when the key
      # is absent and the page says so.
      - name: Build and encrypt the resharing calendar
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDS_JSON:  ${{ secrets.GA4_CREDS_JSON }}
        run: |
          if [ -f build_resharing.py ]; then
            python3 build_resharing.py && python3 encrypt_resharing.py || echo "WARNING: resharing build failed; the resharing page will be stale"
          else
            echo "no build_resharing.py yet — skipping"
          fi

      # The press map harvests bylines from New York City outlets and joins them
      # to the press list, the contributors and the outlets that cite Vital City.
      # Non-fatal for the same reason; the harvest must fail loud on an empty
      # result so a broken feed never publishes an empty map.
      # The press map keeps six months of stories between runs, because the
      # biggest outlets' feeds only reach back a week. Public fields only (no
      # addresses), kept in the Actions cache rather than committed.
      - name: Restore the press map's story history
        uses: actions/cache/restore@v4
        with:
          path: private/press_story_history.json
          key: press-story-history-${{ github.run_id }}
          restore-keys: press-story-history-

      - name: Build and encrypt the press map
        timeout-minutes: 25   # a full harvest runs 11-13 minutes of network wait across ~90 outlets
        env:
          VC_NETWORK_PASS: ${{ secrets.VC_NETWORK_PASS }}
        run: |
          if [ -f build_press.py ]; then
            python3 build_press.py && python3 encrypt_press.py || echo "WARNING: press build failed; the press page will be stale"
          else
            echo "no build_press.py yet — skipping"
          fi

      - name: Save the press map's story history
        if: always() && hashFiles('private/press_story_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: private/press_story_history.json
          key: press-story-history-${{ github.run_id }}

      - name: Commit & push if changed
        run: |
          # Defense-in-depth: never commit a missing/tiny encrypted file (real one is ~6 MB).
          if [ ! -s network/data.enc ] || [ "$(wc -c < network/data.enc)" -lt 100000 ]; then
            echo "ERROR: network/data.enc missing or suspiciously small — aborting commit."
            exit 1
          fi
          git config user.name "Vital City Bot"
          git config user.email "actions@users.noreply.github.com"
          # One path at a time. A single `git add` over the whole list aborts on
          # the first path that does not exist yet (a tool whose build was
          # skipped), staging NOTHING — which is how the rotation rebuild on
          # 2026-09-16 re-encrypted every payload and then published none of them.
          git add data 2>/dev/null || true
          for f in network/data.enc growth/data.enc prospects/data.enc catalogue-analysis/data.enc resharing/data.enc press/data.enc; do
            [ -e "$f" ] && git add "$f"
          done
          # encrypt_people.py runs every time and rewrites network/data.enc with a
          # fresh salt and IV, so the ciphertext always differs. Nothing staged
          # therefore means the staging itself failed, not that nothing changed.
          if git diff --cached --quiet && [ -e network/data.enc ]; then
            echo "ERROR: network/data.enc was re-encrypted but nothing was staged — the publish step is broken, not idle."
            git status --porcelain | head -20
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Daily Ghost refresh $(date -u '+%Y-%m-%d')"
            # Resilient publish: retry transient GitHub push errors (e.g. "fatal error in
            # commit_refs") and rebase past any commits that landed since checkout (a manual
            # push or an overlapping run). On a data-file conflict the fresh build wins (-X theirs).
            ok=
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "pushed on attempt $i"; break; fi
              echo "push attempt $i failed; syncing with origin and retrying…"
              git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
              sleep 8
            done
            [ -n "$ok" ] || { echo "ERROR: could not push after 5 attempts."; exit 1; }
          fi
          # (Institutional mirroring now lives in its own mirror-all.yml workflow,
          # which covers this repo plus every other public vitalcity-nyc repo.)
